# Manual workflow. You pick a client GitHub Environment and one operation:
#   plan-only            - show what Terraform would change; deploy nothing
#   provision-and-deploy - apply infrastructure, then deploy React and FastAPI
#   deploy-only          - upload new app code to web apps that already exist
# Runs only from the main branch. The Environment's required reviewers
# must approve before the job starts.
name: Client Azure Provisioning and Deployment

on:
  workflow_dispatch:
    inputs:
      client_environment:
        description: Existing protected GitHub Environment for the client
        type: environment
        required: true
      operation:
        description: Choose what to run in the selected client subscription
        type: choice
        required: true
        default: plan-only
        options:
          - plan-only
          - provision-and-deploy
          - deploy-only

permissions:
  contents: read

jobs:
  client-operation:
    name: ${{ inputs.operation }} - ${{ inputs.client_environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.client_environment }}

    concurrency:
      group: client-${{ inputs.client_environment }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    # TF_VAR_* become Terraform variables. ARM_* are the Azure login
    # the provider uses. All of them come from the selected Environment,
    # so this job always targets that one client.
    env:
      TF_IN_AUTOMATION: 'true'
      OPERATION: ${{ inputs.operation }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}

      TF_VAR_subscription_id: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_client_code: ${{ vars.CLIENT_CODE }}
      TF_VAR_react_webapp_name: ${{ vars.REACT_WEBAPP_NAME }}
      TF_VAR_fastapi_webapp_name: ${{ vars.FASTAPI_WEBAPP_NAME }}

      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Override these environment variables if your repo uses other folders.
      FRONTEND_DIR: ${{ vars.FRONTEND_DIR || 'frontend' }}
      BACKEND_DIR: ${{ vars.BACKEND_DIR || 'backend' }}
      FRONTEND_BUILD_DIR: ${{ vars.FRONTEND_BUILD_DIR || 'dist' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast if the Environment is incomplete, the workspace name
      # does not match the client code, or a local tfvars file would
      # override the Environment values.
      - name: Check client configuration and repository
        run: |
          set -euo pipefail
          : "${TF_WORKSPACE:?Missing TF_WORKSPACE}"
          : "${TFC_ORGANIZATION:?Missing TFC_ORGANIZATION}"
          : "${TF_VAR_client_code:?Missing CLIENT_CODE}"
          : "${TF_VAR_location:?Missing AZURE_LOCATION}"
          : "${TF_VAR_react_webapp_name:?Missing REACT_WEBAPP_NAME}"
          : "${TF_VAR_fastapi_webapp_name:?Missing FASTAPI_WEBAPP_NAME}"
          : "${ARM_SUBSCRIPTION_ID:?Missing AZURE_CREDENTIALS subscriptionId}"
          : "${EXPECTED_AZURE_SUBSCRIPTION_ID:?Missing AZURE_SUBSCRIPTION_ID}"
          [[ "$ARM_SUBSCRIPTION_ID" == "$EXPECTED_AZURE_SUBSCRIPTION_ID" ]] || {
            echo 'The configured client subscription does not match AZURE_CREDENTIALS.' >&2
            exit 1
          }
          : "${ARM_CLIENT_ID:?Missing AZURE_CREDENTIALS clientId}"
          : "${ARM_TENANT_ID:?Missing AZURE_CREDENTIALS tenantId}"
          : "${ARM_CLIENT_SECRET:?Missing AZURE_CREDENTIALS clientSecret}"

          [[ "$TF_WORKSPACE" != 'default' ]] || {
            echo 'Refusing to operate on the default Terraform workspace.' >&2
            exit 1
          }
          # Example: CLIENT_CODE=acme, TF_WORKSPACE=acme-prod.
          [[ "$TF_WORKSPACE" == "${TF_VAR_client_code}-"* ]] || {
            echo 'Workspace name must begin with CLIENT_CODE followed by a hyphen.' >&2
            exit 1
          }

          # .tfvars files auto-load with higher precedence than TF_VAR_*.
          if find . -maxdepth 1 -type f \( \
              -name 'terraform.tfvars' -o \
              -name 'terraform.tfvars.json' -o \
              -name '*.auto.tfvars' -o \
              -name '*.auto.tfvars.json' \
              \) | grep -q .; then
            echo 'Remove auto-loaded *.tfvars files before client deployment.' >&2
            exit 1
          fi

          case "$OPERATION" in
            plan-only|provision-and-deploy|deploy-only) ;;
            *) echo 'Unsupported operation.' >&2; exit 1 ;;
          esac

          if [[ "$OPERATION" != 'plan-only' ]]; then
            test -f "$FRONTEND_DIR/package.json"
            test -f "$FRONTEND_DIR/package-lock.json"
            test -f "$BACKEND_DIR/main.py"
            test -f "$BACKEND_DIR/requirements.txt"
          fi

      - name: Azure Login
        uses: Azure/login@v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Confirm client subscription
        run: |
          set -euo pipefail
          actual="$(az account show --query id -o tsv)"
          [[ "$actual" == "$EXPECTED_AZURE_SUBSCRIPTION_ID" ]] || {
            echo 'Azure login returned the wrong subscription; stopping.' >&2
            exit 1
          }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="organization=$TFC_ORGANIZATION"

      - name: Verify client Terraform workspace
        run: |
          set -euo pipefail
          workspace="$(terraform workspace show)"
          [[ "$workspace" == "$TF_WORKSPACE" ]] || {
            echo 'Selected Terraform workspace does not match this client.' >&2
            exit 1
          }

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      # plan-only stops after this. provision-and-deploy applies the
      # saved plan. deploy-only skips both and only uploads app code.
      - name: Terraform Plan
        if: inputs.operation != 'deploy-only'
        run: terraform plan -lock-timeout=5m -input=false -out="$RUNNER_TEMP/client.tfplan"

      # No plan file is uploaded as an artifact; it can contain sensitive data.
      # Configure required-reviewer protection for the client GitHub Environment.
      - name: Terraform Apply
        if: inputs.operation == 'provision-and-deploy'
        run: terraform apply -lock-timeout=5m -input=false "$RUNNER_TEMP/client.tfplan"

      - name: Read client deployment targets
        if: inputs.operation != 'plan-only'
        id: target
        run: |
          set -euo pipefail
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "react_app=$(terraform output -raw react_webapp_name)" >> "$GITHUB_OUTPUT"
          echo "fastapi_app=$(terraform output -raw fastapi_webapp_name)" >> "$GITHUB_OUTPUT"
          echo "react_url=$(terraform output -raw react_webapp_url)" >> "$GITHUB_OUTPUT"
          echo "fastapi_url=$(terraform output -raw fastapi_webapp_url)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: inputs.operation != 'plan-only'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      # Vite bakes VITE_API_URL into the browser bundle at build time.
      # The value is the FastAPI site's public URL from Terraform outputs.
      - name: Build React frontend
        if: inputs.operation != 'plan-only'
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          # Adjust the name if your frontend doesn't use Vite.
          VITE_API_URL: ${{ steps.target.outputs.fastapi_url }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f "$FRONTEND_BUILD_DIR/index.html"

      - name: Package React and FastAPI
        if: inputs.operation != 'plan-only'
        run: |
          set -euo pipefail
          (cd "$FRONTEND_DIR/$FRONTEND_BUILD_DIR" && zip -qr "$RUNNER_TEMP/react.zip" .)

          mkdir -p "$RUNNER_TEMP/fastapi-package"
          rsync -a \
            --exclude='.git/' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.env*' \
            --exclude='.npmrc' \
            --exclude='*.pyc' \
            --exclude='*.pem' \
            --exclude='*.pfx' \
            --exclude='*.key' \
            "$BACKEND_DIR/" "$RUNNER_TEMP/fastapi-package/"
          (cd "$RUNNER_TEMP/fastapi-package" && zip -qr "$RUNNER_TEMP/fastapi.zip" .)

      - name: Deploy FastAPI backend
        if: inputs.operation != 'plan-only'
        uses: Azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ steps.target.outputs.fastapi_app }}
          resource-group-name: ${{ steps.target.outputs.resource_group }}
          package: ${{ runner.temp }}/fastapi.zip

      - name: Deploy React frontend
        if: inputs.operation != 'plan-only'
        uses: Azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ steps.target.outputs.react_app }}
          resource-group-name: ${{ steps.target.outputs.resource_group }}
          package: ${{ runner.temp }}/react.zip

      - name: Client deployment summary
        if: inputs.operation != 'plan-only'
        env:
          REACT_URL: ${{ steps.target.outputs.react_url }}
          FASTAPI_URL: ${{ steps.target.outputs.fastapi_url }}
        run: |
          {
            echo '## Client deployment'
            echo "Frontend: $REACT_URL"
            echo "Backend: $FASTAPI_URL"
          } >> "$GITHUB_STEP_SUMMARY"
